# ProfilePlugin Configuration

# Storage settings
storage:
  type: sqlite
  file: profiles.db

# Maximum number of fields a player can have set
max-fields-per-profile: 20

# Cooldown between /profile set commands (in seconds)
set-cooldown-seconds: 2

# Display settings
display:
  header: '&6%player%''s Profile\n'
  field-line: '&e%field%&7: &f%value%'
  footer: '&8----'

# Field definitions - these are hardcoded in the plugin but configurable here
fields:
  name:
    enabled: true
    max-length: 32
    multiline: false
    admin-only: false
    display-name: 'Display Name'
    color: '&e'

  age:
    enabled: true
    max-length: 3
    multiline: false
    admin-only: false
    display-name: 'Age'
    color: '&b'

  gender:
    enabled: true
    display-name: 'Gender'
    color: '&d'

  description:
    enabled: true
    max-length: 200
    multiline: true
    admin-only: false
    display-name: 'Description'
    color: '&7'

  location:
    enabled: true
    max-length: 50
    multiline: false
    admin-only: false
    display-name: 'Location'
    color: '&a'

  discord:
    enabled: true
    max-length: 37
    multiline: false
    admin-only: false
    display-name: 'Discord'
    color: '&5'

  # Social Media Fields (appear in Links section)
  github:
    enabled: true
    max-length: 100
    multiline: false
    admin-only: false
    display-name: 'GitHub'
    color: '&6'

  instagram:
    enabled: true
    max-length: 100
    multiline: false
    admin-only: false
    display-name: 'Instagram'
    color: '&d'

  twitter:
    enabled: true
    max-length: 100
    multiline: false
    admin-only: false
    display-name: 'Twitter'
    color: '&b'

  youtube:
    enabled: true
    max-length: 100
    multiline: false
    admin-only: false
    display-name: 'YouTube'
    color: '&c'

  twitch:
    enabled: true
    max-length: 100
    multiline: false
    admin-only: false
    display-name: 'Twitch'
    color: '&5'

  tiktok:
    enabled: true
    max-length: 100
    multiline: false
    admin-only: false
    display-name: 'TikTok'
    color: '&d'

  reddit:
    enabled: true
    max-length: 100
    multiline: false
    admin-only: false
    display-name: 'Reddit'
    color: '&c'

  skills:
    enabled: true
    max-length: 100
    multiline: false
    admin-only: false
    allowed-values:
      - Builder
      - Redstone
      - PvP
      - Parkour
      - Explorer
      - Farms
      - Fishing
      - Mining
    display-name: 'Skills'
    color: '&2'

  experience:
    enabled: true
    max-length: 20
    multiline: false
    admin-only: true
    allowed-values:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      - Legendary
    display-name: 'Experience'
    color: '&c'

  timezone:
    enabled: true
    max-length: 20
    multiline: false
    admin-only: false
    display-name: 'Time Zone'
    color: '&3'

  language:
    enabled: true
    max-length: 20
    multiline: false
    admin-only: false
    display-name: 'Language'
    color: '&9'

# Messages
messages:
  no-permission: '&cYou don''t have permission to use this command.'
  no-permission-others: '&cYou don''t have permission to view/modify other players'' profiles.'
  field-set: '&aSet %field% to: &f%value%'
  field-unset: '&aRemoved field: &e%field%'
  field-cleared: '&aCleared field: &e%field%'
  field-not-set: '&cField %field% is not set on your profile.'
  profile-cleared: '&aYour entire profile has been cleared.'
  field-invalid: '&cUnknown field: &e%field%'
  field-admin-only: '&cField %field% is admin-only.'
  field-disabled: '&cField %field% is currently disabled.'
  value-too-long: '&cValue is too long! Maximum length: &e%max%'
  value-not-allowed: '&cThat value is not allowed. Allowed values: &e%allowed%'
  too-many-fields: '&cYou have reached the maximum of %max% profile fields.'
  on-cooldown: '&cPlease wait before using /profile set again.'
  player-not-found: '&cPlayer not found.'
  no-profile: '&e%player% has no profile set up.'